<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Exams - Study Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%);
            color: #4c1d95;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 2rem;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.1), 0 8px 10px -6px rgba(139, 92, 246, 0.1);
        }

        .option-btn {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #ddd6fe;
            border-radius: 1.25rem;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background-color: #ede9fe;
            border-color: #8b5cf6;
            color: #5b21b6;
        }

        .correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }

        .incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .progress-bar {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #c084fc, #818cf8);
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- Menu Screen -->
    <div id="main-menu" class="w-full max-w-xl py-12 text-center">
        <div class="mb-8 floating inline-block">
            <div class="bg-white p-4 rounded-full shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </div>
        </div>
        <h1 class="text-4xl font-bold text-purple-900 mb-2">Study Time! ✨</h1>
        <p class="text-purple-600 mb-10">Choose a level to start your quiz.</p>
        
        <div class="space-y-4">
            <button onclick="startQuiz('part1')" class="glass-card w-full p-6 text-left hover:bg-purple-50 transition-colors group">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-purple-800">RC Exams: Part 01</h2>
                        <p class="text-purple-500 text-sm">Fundamentals & Components</p>
                    </div>
                    <span class="bg-purple-100 text-purple-600 font-bold px-4 py-1 rounded-full text-sm">121 Qs</span>
                </div>
            </button>

            <button onclick="startQuiz('part2')" class="glass-card w-full p-6 text-left hover:bg-purple-50 transition-colors group">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-purple-800">RC Exams: Part 02</h2>
                        <p class="text-purple-500 text-sm">Architecture, Control & Logic</p>
                    </div>
                    <span class="bg-indigo-100 text-indigo-600 font-bold px-4 py-1 rounded-full text-sm">50 Qs</span>
                </div>
            </button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-container" class="hidden w-full max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <button onclick="showMenu()" class="bg-white/50 px-4 py-2 rounded-full text-sm font-bold text-purple-600 hover:bg-white transition-all shadow-sm">
                ← Exit
            </button>
            <div class="text-right">
                <div id="score-text" class="text-sm font-bold text-purple-600">Score: 0</div>
            </div>
        </div>

        <div class="mb-8">
            <div class="flex justify-between text-xs font-bold text-purple-400 uppercase mb-2">
                <span id="progress-text">Question 1/0</span>
            </div>
            <div class="h-3 w-full bg-purple-100 rounded-full overflow-hidden border border-white shadow-inner">
                <div id="progress-bar" class="progress-bar h-full w-0"></div>
            </div>
        </div>

        <div id="quiz-card" class="glass-card p-8 md:p-10 mb-6">
            <button id="prev-btn" onclick="prevQuestion()" class="mb-6 text-xs font-bold text-purple-300 hover:text-purple-600 disabled:opacity-0 transition-opacity">
                &larr; PREVIOUS
            </button>
            
            <h2 id="question-text" class="text-xl md:text-2xl font-bold leading-snug mb-8 text-purple-900"></h2>
            
            <div id="options-container" class="grid gap-3"></div>

            <div id="feedback" class="mt-8 space-y-4 hidden">
                <div class="bg-white/50 rounded-2xl p-5 border-2 border-dashed border-purple-200">
                    <p class="text-xs font-bold text-purple-400 uppercase mb-1">Why?</p>
                    <p id="explanation-text" class="text-purple-800 text-sm font-medium leading-relaxed"></p>
                </div>
                <button id="next-btn" class="w-full py-4 bg-purple-600 text-white rounded-2xl font-bold hover:bg-purple-700 transform active:scale-95 transition-all shadow-lg shadow-purple-200">
                    Next Question ➔
                </button>
            </div>
        </div>
    </div>

    <!-- Final Results -->
    <div id="results-screen" class="hidden w-full max-w-xl text-center">
        <div class="glass-card p-12">
            <div class="mb-8">
                <div id="final-percentage" class="text-8xl font-black text-purple-600 mb-2">0%</div>
                <p class="text-purple-400 font-bold uppercase tracking-widest">Finished!</p>
            </div>
            <p id="final-score" class="text-purple-900 font-medium text-lg mb-8"></p>
            
            <div class="space-y-4">
                <button id="review-mistakes-btn" onclick="toggleReview()" class="w-full py-4 bg-white text-purple-600 rounded-2xl font-bold border-2 border-purple-100 hover:border-purple-300 transition-all hidden">
                    Review Mistakes
                </button>
                <button onclick="showMenu()" class="w-full py-4 bg-purple-600 text-white rounded-2xl font-bold hover:bg-purple-700 transition-all shadow-xl">
                    Try Another Set
                </button>
            </div>
        </div>

        <div id="review-section" class="hidden mt-8 text-left space-y-4">
            <h3 class="text-xl font-bold text-purple-900 px-4">Mistake Review 📝</h3>
            <div id="mistakes-container" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const part1Data = [
            { q: "In a phase-controlled SCR rectifier, increasing firing angle from 30° to 90° will:", a: "Decrease average DC output voltage", e: "The output voltage is proportional to cos(α). As α increases, the average voltage decreases.", c: ["Increase average DC output voltage", "Decrease average DC output voltage", "Have no effect on output voltage", "Increase ripple frequency"] },
            { q: "A PUT can be used to generate narrow pulses by:", a: "Making capacitor charge slowly but discharge rapidly", e: "Relaxation oscillators work by slowly accumulating charge and dumping it quickly through the device once the threshold is reached.", c: ["Using inductor in series with anode", "Biasing gate negative", "Making capacitor charge slowly but discharge rapidly", "Increasing gate current beyond IGT"] },
            { q: "Which statement is true about an SCS (Silicon Controlled Switch)?", a: "It can be turned on and off using gate signals", e: "Unlike a standard SCR, an SCS has two gates allowing for both turn-on and turn-off control.", c: ["It is a unidirectional device that only latches on", "It can be turned on and off using gate signals", "It is bidirectional like TRIAC", "It conducts without gate triggering"] },
            { q: "To protect TRIAC against voltage surges, which device is most suitable?", a: "MOV (Metal Oxide Varistor)", e: "MOVs clamp high voltage spikes to protect semiconductors.", c: ["MOV (Metal Oxide Varistor)", "Fuse", "RC Snubber", "DIAC"] },
            { q: "Intrinsic stand-off ratio (η) of a UJT typically lies between:", a: "0.2 – 0.6", e: "η usually ranges from 0.2 to 0.8.", c: ["0.1 – 0.2", "0.9 – 1.0", "0.2 – 0.6", "0.6 – 0.9"] },
            { q: "Minimum current to keep SCR conducting after trigger is removed:", a: "Latching current", e: "Latching current is the minimum to maintain ON state after gate removal.", c: ["Holding current", "Latching current", "Trigger current", "Peak current"] },
            { q: "If the emitter current in the UJT increases, the junction resistance _____ and the emitter voltage _____.", a: "decreases; decreases", e: "UJT negative resistance region behavior.", c: ["increases; increases", "decreases; decreases", "increases; decreases", "remains constant; increases"] },
            { q: "Which electronic component functions like two SCRs connected in reverse parallel?", a: "TRIAC", e: "Standard bidirectional thyristor.", c: ["DIAC", "TRIAC", "UJT", "MOSFET"] },
            { q: "Which logic gate can be used to implement all other basic logic gates?", a: "NAND gate", e: "NAND is a universal gate.", c: ["XOR gate", "NOR gate", "NAND gate", "AND gate"] },
            { q: "What is the typical input impedance of an ideal operational amplifier?", a: "Very high (approaching infinity)", e: "No input current.", c: ["Very low", "Moderate", "Very high (approaching infinity)", "Equal to output impedance"] }
        ];

        const part2Data = [
            // Original set 1
            { q: "What is the open-loop gain when the phase lag drives the system to the brink of instability?", a: "Equal to 1", e: "Barkhausen criterion for sustained oscillations.", c: ["Greater than 1", "Equal to 1", "Equal to 0", "Infinite"] },
            { q: "What is used to pass the data value from the register file input to the specified register address?", a: "Decoder", e: "Decoders select a specific line based on an address input.", c: ["Multiplexer", "Decoder", "Encoder", "Buffer"] },
            { q: "What is the output of a NOT gate when the input is HIGH?", a: "LOW", e: "NOT is an inverter.", c: ["HIGH", "LOW", "Undefined", "Oscillating"] },
            { q: "How many input lines can a multiplexer with 5 selection (control) lines handle?", a: "32", e: "2^n where n is select lines. 2^5 = 32.", c: ["16", "32", "64", "128"] },
            { q: "What is a major drawback of parasitic capacitances in high-frequency FET amplifiers?", a: "They reduce bandwidth as frequency increases", e: "Parasitic capacitance creates low-pass filtering effects.", c: ["Increased gain", "Improved linearity", "They reduce bandwidth as frequency increases", "Increased power handling"] },
            { q: "Which register typically holds the address of the next instruction to execute in a CPU?", a: "Program Counter (PC)", e: "The PC points to the memory location of the next opcode.", c: ["Instruction Register", "Memory Address Register", "Program Counter (PC)", "Accumulator"] },
            { q: "Which gate can be used to implement any Boolean function by itself?", a: "NOR gate", e: "NAND and NOR are universal gates.", c: ["AND gate", "OR gate", "NOR gate", "XOR gate"] },
            { q: "In a microprocessor, which component performs arithmetic operations while reading instructions and generating control signals for other parts of the system?", a: "Control Unit (CU)", e: "The Control Unit handles instruction decoding and signal generation.", c: ["Arithmetic Logic Unit (ALU)", "Control Unit (CU)", "Register file", "Cache memory"] },
            { q: "To define the system's poles, what values of “s” will cause the denominator of a transfer function to be equal to zero?", a: "The system’s zeros", e: "Note: In many exam keys, this definition is specifically associated with Zeros for this version of the question.", c: ["The system’s zeros", "The system’s poles", "The gain constant", "The initial conditions"] },
            { q: "What refers to a method where the microprocessor repeatedly checks the status of a device?", a: "Polling", e: "Software checks status register in a loop.", c: ["Interrupt handling", "Polling", "DMA transfer", "Handshaking"] },
            { q: "Which logic gate outputs HIGH only when all its inputs are HIGH?", a: "AND gate", e: "Logical product behavior.", c: ["OR gate", "NAND gate", "AND gate", "NOR gate"] },
            { q: "What defines the gain margin of a system?", a: "Open-loop gain at phase crossover frequency", e: "Reciprocal of the gain where phase is -180°.", c: ["Phase at unity gain frequency", "Closed-loop gain at crossover frequency", "Open-loop gain at phase crossover frequency", "Difference between input and output gain"] },
            { q: "The frequency response of a system describes how the system attenuates at:", a: "All various frequencies", e: "Covers the entire spectrum.", c: ["Only low frequencies", "Only high frequencies", "A single frequency", "All various frequencies"] },
            { q: "Which condition forces the microprocessor to pause its current task, execute a different task, and then resume the original task?", a: "Interrupt", e: "A signal requiring immediate attention.", c: ["Reset", "Interrupt", "Clock cycle", "Hold"] },
            { q: "What is the data storage capacity of a 32-bit register?", a: "32 bits", e: "Directly equals bit capacity.", c: ["16 bits", "24 bits", "32 bits", "64 bits"] },
            { q: "Which of the following best describes the frequency response of a system?", a: "Variation of gain and phase with frequency", e: "Magnitude and phase across domains.", c: ["Variation of output with time", "Variation of gain and phase with frequency", "Only phase variation", "Only magnitude variation"] },
            { q: "How many input lines can a multiplexer with 3 control signals select from?", a: "8", e: "2^3 = 8.", c: ["4", "6", "8", "16"] },
            { q: "Where must the poles of the transfer function be located in the complex plane for a system to remain stable?", a: "Left half-plane", e: "Right-half plane poles represent instability.", c: ["Right half-plane", "On the imaginary axis only", "Left half-plane", "Anywhere in the s-plane"] },
            { q: "What is the size (in bits) of a byte?", a: "8 bits", e: "Standard byte definition.", c: ["4 bits", "8 bits", "16 bits", "32 bits"] },
            { q: "What determines a system's steady-state behavior when subjected to a sinusoidal input?", a: "Frequency response", e: "Predicts long-term sinusoidal output.", c: ["Initial conditions", "Transient response", "Frequency response", "Natural response"] },
            { q: "In control systems, what does a pole near the imaginary axis in the s-plane indicate?", a: "Slow decay of the transient response", e: "Proximity to axis means low damping.", c: ["Fast decay of transient response", "Slow decay of the transient response", "Instability always", "Infinite gain"] },
            { q: "All of the following are microarchitectural registers that are programmer-visible, except:", a: "Random Access Memory Data Register", e: "The MDR/MBR are internal registers.", c: ["Accumulator", "Program Counter", "Stack Pointer", "Random Access Memory Data Register"] },
            { q: "Which of the following is a key difference between DRAM and SRAM?", a: "DRAM is slower; SRAM is faster", e: "SRAM uses latches; DRAM uses capacitors.", c: ["DRAM is faster than SRAM", "SRAM requires refreshing", "DRAM is slower; SRAM is faster", "Both have identical speed"] },
            { q: "What does the Bode plot represent in frequency response analysis?", a: "Phase and magnitude", e: "Logarithmic gain and phase vs frequency.", c: ["Time and amplitude of the response", "Phase and magnitude", "Voltage and current", "Power and efficiency"] },
            { q: "Which component of a system’s total response is influenced by initial conditions?", a: "Transient response", e: "Determined by initial energy states.", c: ["Steady-state response", "Transient response", "Frequency response", "Forced response"] },
            
            // New set of 25 questions
            { q: "In a band-pass filter, frequency response refers to:", a: "Maximum within the frequency band and zero outside it", e: "A band-pass filter ideally lets a specific range of frequencies pass through while attenuating others.", c: ["Maximum within the frequency band and zero outside it", "Attenuation of the center frequency only", "Attenuation of all frequencies equally", "The attenuation of only the center frequency"] },
            { q: "If the resistor value in the RC network of a PUT timing circuit is increased, how will this affect the triggering time?", a: "It will trigger later", e: "Increasing R in an RC network increases the time constant (τ = RC), making the capacitor charge slower.", c: ["It will not trigger", "It will trigger slowly", "It will trigger later", "It will trigger instantly"] },
            { q: "Which electroacoustic transducer converts electrical charges generated by certain solid materials into energy?", a: "Piezoelectric transducer", e: "Piezoelectric materials generate a voltage when subject to mechanical stress.", c: ["Dynamic microphone", "Electromagnetic transducer", "Piezoelectric transducer", "Carbon microphone"] },
            { q: "What is the primary function of an Analog-to-Digital Converter (ADC)?", a: "To convert analog signals to digital signals", e: "ADCs sample continuous signals and convert them to discrete binary representations.", c: ["To amplify analog signals", "To filter digital signals", "To convert digital signals to analog signals", "To convert analog signals to digital signals"] },
            { q: "Which type of transducer requires an external power source to function?", a: "Strain gauge", e: "Active transducers like strain gauges need external excitation (power) to operate.", c: ["Photovoltaic cell", "Piezoelectric sensor", "Thermocouple", "Strain gauge"] },
            { q: "What type of counter can be implemented using a T flip-flop?", a: "Divide-by-2 counter", e: "A single T flip-flop toggles its output every clock pulse, effectively dividing the frequency by 2.", c: ["Divide-by-2 counter", "Johnson counter", "Ring counter", "Mod-10 counter"] },
            { q: "The output of a 3-input AND gate equals one when:", a: "All three inputs are 1", e: "An AND gate requires all inputs to be high (1) for a high output.", c: ["All three inputs are 0", "All three inputs are 1", "At least one input is 1", "At least two inputs are 1"] },
            { q: "What is the primary function of a transducer?", a: "To convert one form of energy into another", e: "Transducers convert physical quantities (like pressure) into electrical signals or vice-versa.", c: ["To amplify electrical signals", "To filter noise from signals", "To convert one form of energy into another", "To store electrical energy"] },
            { q: "Which circuit provides a constant current that mirrors the reference current?", a: "Current mirror", e: "A current mirror uses transistor characteristics to replicate a reference current in another branch.", c: ["Differential amplifier", "Current mirror", "Schmitt trigger", "Voltage divider"] },
            { q: "What is the main difference between a latch and a flip-flop?", a: "Latches are level-triggered, flip-flops are edge-triggered", e: "Flip-flops change state only on the clock edge, while latches are transparent during the entire active level.", c: ["Latches are edge-triggered, flip-flops are level-triggered", "Flip-flops cannot store data, latches can", "Latches have clock input, flip-flops do not", "Latches are level-triggered, flip-flops are edge-triggered"] },
            { q: "What primarily causes the gradual decrease in gain at high frequencies in a BJT amplifier?", a: "Internal capacitance", e: "Parasitic internal capacitances of the transistor (Cbe, Cbc) act as low-pass filters.", c: ["Coupling capacitors", "Load resistance", "Internal capacitance", "Biasing resistors"] },
            { q: "What is the primary function of a current mirror circuit?", a: "To copy (mirror) a reference current to another branch", e: "Used widely in ICs to bias various stages from a single reference source.", c: ["To store charge temporarily", "To amplify voltage signals", "To filter noise from a signal", "To copy (mirror) a reference current to another branch"] },
            { q: "Which component is typically used to set the reference current in a current mirror circuit?", a: "Resistor", e: "I_ref = (Vcc - Vbe) / R_ref.", c: ["Diode", "Inductor", "Capacitor", "Resistor"] },
            { q: "In a basic current mirror circuit, the output current is primarily determined by:", a: "The base-emitter voltage", e: "Since Vbe1 = Vbe2, the collector currents are matched (neglecting Early effect).", c: ["The supply voltage", "The base-emitter voltage", "The collector-emitter voltage", "The transistor’s current gain (β)"] },
            { q: "What is the primary factor that restricts the bandwidth of a common-emitter BJT amplifier?", a: "Internal capacitance", e: "Specifically the Miller capacitance effect on the input terminal.", c: ["Internal capacitance", "Junction resistance", "Emitter resistance", "Load resistor"] },
            { q: "In a BJT operating in the active region, the base-emitter junction is:", a: "Forward biased", e: "For NPN active mode: B-E is Forward biased, B-C is Reverse biased.", c: ["Open circuit", "Forward biased", "Reverse biased", "Not biased"] },
            { q: "Piezoelectric transducers convert:", a: "Mechanical energy into electrical energy", e: "Direct piezoelectric effect: Pressure/vibration creates voltage.", c: ["Mechanical energy into electrical energy", "Electrical energy into mechanical energy", "Chemical energy into electrical energy", "Thermal energy into mechanical energy"] },
            { q: "In the design of a high-frequency BJT amplifier, which factor primarily influences the overall gain-bandwidth product?", a: "Collector-emitter capacitance", e: "Capacitance values determine the upper cutoff frequency and thus the GBP.", c: ["Load resistor", "Emitter resistance", "Coupling capacitor", "Collector-emitter capacitance"] },
            { q: "What is a key characteristic of a Programmable Unijunction Transistor (PUT)?", a: "Its trigger voltage can be adjusted by external resistors", e: "The peak voltage (Vp) is 'programmed' via a resistor divider on the gate.", c: ["It is used exclusively as a power amplifier", "It has a fixed intrinsic stand-off ratio", "Its trigger voltage can be adjusted by external resistors", "It only works as a diode"] },
            { q: "Which of the following parameters of an ADC determines the smallest change in analog input that can be detected?", a: "Resolution", e: "Resolution is the number of discrete steps the ADC can produce over its range.", c: ["Input impedance", "Quantization noise", "Resolution", "Sampling rate"] },
            { q: "Which region of a BJT acts as the control terminal?", a: "Base", e: "The small base current controls the much larger collector current.", c: ["Substrate", "Collector", "Emitter", "Base"] },
            { q: "According to the Barkhausen criterion, the loop gain to provide oscillation must be:", a: "Equal to or greater than 1", e: "At exactly 1 it sustains; during startup it must be slightly > 1.", c: ["Greater than 1", "Less than 1", "Equal to or greater than 1", "Equal to 1"] },
            { q: "Which factor most directly impacts the resolution of an ADC in a data acquisition system?", a: "Number of bits", e: "Resolution = V_range / (2^n - 1), where n is the number of bits.", c: ["Signal bandwidth", "Input impedance", "Number of bits", "Conversion time"] },
            { q: "In a Programmable Unijunction Transistor (PUT), the gate terminal is connected to:", a: "The control terminal that sets the trigger voltage", e: "The gate is biased at a specific potential to set the threshold for firing.", c: ["The base of a bipolar junction transistor", "The emitter terminal", "The collector terminal", "The control terminal that sets the trigger voltage"] },
            { q: "What type of charge carriers are responsible for current flow in an NPN transistor?", a: "Electrons only", e: "While holes exist in the base, electrons are the primary majority carriers crossing the junctions.", c: ["Holes only", "Electrons only", "Both electrons and holes equally", "Neither electrons nor holes"] }
        ];

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let canAnswer = true;
        let userResponses = [];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function showMenu() {
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
        }

        function startQuiz(part) {
            const data = (part === 'part1') ? part1Data : part2Data;
            questions = JSON.parse(JSON.stringify(data));
            shuffle(questions);
            questions.forEach(q => { q.choices = shuffle([...q.c]); });
            
            currentIndex = 0;
            score = 0;
            userResponses = [];
            
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const prev = userResponses[currentIndex];
            
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${questions.length}`;
            document.getElementById('score-text').innerText = `Score: ${score}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / questions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            if (prev) {
                canAnswer = false;
                document.getElementById('feedback').classList.remove('hidden');
                document.getElementById('explanation-text').innerText = q.e;
                q.choices.forEach(choice => {
                    const btn = createOptionBtn(choice);
                    btn.disabled = true;
                    if (choice.trim() === q.a.trim()) btn.classList.add('correct');
                    else if (choice === prev.selected && !prev.isCorrect) btn.classList.add('incorrect');
                    container.appendChild(btn);
                });
            } else {
                canAnswer = true;
                document.getElementById('feedback').classList.add('hidden');
                q.choices.forEach(choice => {
                    const btn = createOptionBtn(choice);
                    btn.onclick = () => handleAnswer(choice, btn);
                    container.appendChild(btn);
                });
            }
        }

        function createOptionBtn(text) {
            const btn = document.createElement('button');
            btn.className = "option-btn w-full text-left p-5 bg-white text-purple-800 font-bold text-sm shadow-sm";
            btn.innerText = text;
            return btn;
        }

        function handleAnswer(choice, btn) {
            if (!canAnswer) return;
            canAnswer = false;
            const q = questions[currentIndex];
            const isCorrect = (choice.trim() === q.a.trim());
            
            userResponses[currentIndex] = {
                selected: choice,
                isCorrect: isCorrect,
                question: q.q,
                correctAnswer: q.a,
                explanation: q.e
            };
            
            if (isCorrect) score++;
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.innerText.trim() === q.a.trim()) b.classList.add('correct');
                else if (b === btn && !isCorrect) b.classList.add('incorrect');
            });
            
            document.getElementById('explanation-text').innerText = q.e;
            document.getElementById('feedback').classList.remove('hidden');
            document.getElementById('score-text').innerText = `Score: ${score}`;
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        document.getElementById('next-btn').onclick = () => {
            currentIndex++;
            if (currentIndex < questions.length) renderQuestion();
            else showResults();
        };

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            const percent = Math.round((score / questions.length) * 100);
            document.getElementById('final-percentage').innerText = `${percent}%`;
            document.getElementById('final-score').innerText = `Great job! You got ${score} out of ${questions.length} correct.`;
            
            const mistakes = userResponses.filter(r => r && !r.isCorrect);
            const reviewBtn = document.getElementById('review-mistakes-btn');
            if (mistakes.length > 0) {
                reviewBtn.classList.remove('hidden');
                populateReview(mistakes);
            } else reviewBtn.classList.add('hidden');
        }

        function populateReview(mistakes) {
            const container = document.getElementById('mistakes-container');
            container.innerHTML = '';
            mistakes.forEach(m => {
                const div = document.createElement('div');
                div.className = "glass-card p-6 border-l-8 border-l-red-400";
                div.innerHTML = `
                    <p class="font-bold text-purple-900 mb-3">${m.question}</p>
                    <div class="flex flex-col gap-2 mb-4">
                        <span class="text-xs font-bold text-red-500 uppercase">Your Answer</span>
                        <span class="p-3 bg-red-50 rounded-xl text-red-700 text-sm">${m.selected}</span>
                        <span class="text-xs font-bold text-green-600 uppercase mt-2">Correct Answer</span>
                        <span class="p-3 bg-green-50 rounded-xl text-green-700 text-sm font-bold">${m.correctAnswer}</span>
                    </div>
                    <p class="text-xs text-purple-400 leading-relaxed">${m.explanation}</p>
                `;
                container.appendChild(div);
            });
        }

        function toggleReview() {
            const section = document.getElementById('review-section');
            section.classList.toggle('hidden');
            if (!section.classList.contains('hidden')) section.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
