<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Exams: Part 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f3ff;
            color: #2e1065;
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateX(4px);
            background-color: #f3f0ff;
            border-color: #ddd6fe;
        }

        .correct {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }

        .incorrect {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .progress-bar {
            transition: width 0.4s ease;
        }

        .review-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .review-scroll::-webkit-scrollbar-thumb {
            background-color: #ddd6fe;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center">

    <div id="app" class="w-full max-w-2xl">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-light tracking-tight text-violet-900 mb-2">RC Exams: Part 01</h1>
            <p class="text-violet-500 text-sm">SCR, UJT, Logic, Circuit Theory, and Op-Amps</p>
        </div>

        <div class="mb-6" id="progress-container">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs font-semibold text-violet-400 uppercase tracking-wider" id="progress-text">Question 1 of 121</span>
                <span class="text-xs font-semibold text-violet-400 uppercase tracking-wider" id="score-text">Score: 0</span>
            </div>
            <div class="h-2 w-full bg-violet-200 rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar h-full bg-violet-600 w-0"></div>
            </div>
        </div>

        <div id="quiz-card" class="bg-white rounded-3xl shadow-sm border border-violet-100 p-8 mb-6 relative">
            <button id="prev-btn" onclick="prevQuestion()" class="mb-4 text-xs font-bold text-violet-400 hover:text-violet-600 flex items-center gap-1 transition-colors disabled:opacity-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                BACK
            </button>

            <h2 id="question-text" class="text-xl font-medium leading-relaxed mb-8 text-slate-800">Loading question...</h2>
            
            <div id="options-container" class="space-y-3"></div>

            <div id="feedback" class="mt-8 pt-6 border-t border-violet-50 hidden">
                <p id="explanation-text" class="text-sm leading-relaxed text-slate-600 bg-violet-50 p-4 rounded-xl"></p>
                <button id="next-btn" class="mt-6 w-full py-3 bg-violet-700 text-white rounded-2xl font-medium hover:bg-violet-800 transition-colors shadow-md shadow-violet-200">
                    Next Question
                </button>
            </div>
        </div>

        <div id="footer-controls" class="flex gap-4 justify-center">
            <button onclick="resetQuiz(false)" class="text-sm text-violet-400 hover:text-violet-600 transition-colors font-medium">Reset Quiz</button>
            <span class="text-violet-200">|</span>
            <button onclick="resetQuiz(true)" class="text-sm text-violet-400 hover:text-violet-600 transition-colors font-medium">Shuffle & Reset</button>
        </div>
    </div>

    <div id="results-screen" class="hidden w-full max-w-2xl text-center flex-col items-center">
        <div class="bg-white w-full rounded-3xl shadow-sm border border-violet-100 p-12 mb-6">
            <div class="mb-6">
                <div id="final-percentage" class="text-7xl font-light text-violet-600 mb-2">0%</div>
                <p class="text-violet-400 font-medium">Quiz Completed!</p>
            </div>
            <p id="final-score" class="text-slate-700 mb-8"></p>
            
            <div class="flex flex-col gap-3">
                <button id="review-mistakes-btn" onclick="toggleReview()" class="w-full py-4 border-2 border-violet-100 text-violet-600 rounded-2xl font-medium hover:bg-violet-50 transition-all hidden">
                    Review Mistakes
                </button>
                <button onclick="resetQuiz(true)" class="w-full py-4 bg-violet-700 text-white rounded-2xl font-medium hover:bg-violet-800 transition-all shadow-lg shadow-violet-200">
                    Restart Quiz
                </button>
            </div>
        </div>

        <div id="review-section" class="hidden w-full text-left bg-white rounded-3xl shadow-sm border border-violet-100 p-8 max-h-[500px] overflow-y-auto review-scroll">
            <h3 class="text-lg font-bold text-violet-900 mb-6">Mistake Review</h3>
            <div id="mistakes-container" class="space-y-6"></div>
        </div>
    </div>

            { q: "The output of a voltage divider is 9 V with no load. When a load is connected, the output voltage:", a: "Decreases", e: "Connecting a load in parallel with the output resistor reduces the effective resistance, thus reducing output voltage.", c: ["Increases", "Remains constant", "Decreases", "Becomes zero"] },
            { q: "In the context of loop and junction rules, a junction is a point:", a: "Where three or more wires are joined", e: "A node or junction is defined as a connection point of 3 or more branches.", c: ["Where voltage is measured", "Where current reverses direction", "Where three or more wires are joined", "Where resistance is zero"] },
            { q: "A 220-Ω, 2.2-kΩ, and 200-Ω resistor are connected across 15 V. What happens to the equivalent resistance if the voltage is doubled to 30 V?", a: "It does not change", e: "Resistance is a physical property of the components, independent of the applied voltage.", c: ["It doubles", "It halves", "It changes proportionally", "It does not change"] },
            { q: "Nine identical wires each of diameter d and length L are connected in series. The equivalent resistance equals that of a single wire of length L and diameter:", a: "d/3", e: "Series R_eq = 9R. Resistance is inversely proportional to diameter squared.", c: ["3d", "d/3", "d/9", "9d"] },
            { q: "When an additional resistor is connected across an existing parallel circuit, the total resistance:", a: "Decreases", e: "Adding more parallel branches always reduces the equivalent resistance.", c: ["Increases", "Remains constant", "Decreases", "Becomes infinite"] },
            { q: "A constant-voltage source ideally:", a: "Has very low internal resistance", e: "An ideal voltage source has zero internal resistance.", c: ["Has high internal resistance", "Has very low internal resistance", "Delivers constant current", "Produces zero power loss"] },
            { q: "Resistor 1 has twice the resistance of resistor 2. They are connected in parallel and a fixed voltage is applied. The rate of thermal energy generation in resistor 1 is:", a: "Half that in resistor 2", e: "In parallel, P = V²/R. If R1 = 2R2, then P1 = P2/2.", c: ["Twice that in resistor 2", "Equal to that in resistor 2", "Half that in resistor 2", "Four times that in resistor 2"] },
            { q: "A complete short develops across one of five parallel resistors on a PC board. The most likely result is:", a: "The fuse in the power supply will blow", e: "A short circuit creates a path of zero resistance, causing current to spike and blow the protection fuse.", c: ["All resistors burn out", "The fuse in the power supply will blow", "The voltage increases", "The current becomes zero"] },
            { q: "Kirchhoff’s voltage law states that:", a: "The algebraic sum of voltages in any closed loop is zero", e: "KVL: Energy conservation requires the sum of potential changes around a loop to be zero.", c: ["Current is the same everywhere", "Power is conserved in a loop", "The algebraic sum of voltages in any closed loop is zero", "Voltage depends on resistance only"] },
            { q: "A battery is connected across two identical resistors in series. If the battery voltage is V and current is i, then:", a: "Each resistor has voltage V/2 and current i", e: "In series, current is same (i). Since resistors are identical, voltage splits equally (V/2).", c: ["Each resistor has voltage V", "Each resistor has voltage V/2 and current i", "Current splits equally", "Voltage depends on resistance"] },
            { q: "In a series circuit, the largest resistance has:", a: "The largest voltage drop", e: "V = IR. Since I is the same in series, the larger R results in a larger V.", c: ["The smallest voltage drop", "The largest voltage drop", "The greatest current", "Zero power dissipation"] },
            { q: "Resistor 1 has twice the resistance of resistor 2 and they are connected in series. Which statement is correct?", a: "Voltage across R₁ is twice that across R₂", e: "V = IR. With same current, if R1 = 2*R2, then V1 = 2*V2.", c: ["Current through R₁ is twice that of R₂", "Voltage across R₁ is half that across R₂", "Voltage across R₁ is twice that across R₂", "Power dissipated is equal"] },
            // NEW AMPLIFIER AND OP-AMP SET
            { q: "What is a common disadvantage of a cascaded amplifier configuration?", a: "Increased noise and potential complexity issues", e: "Cascading adds the noise of each stage and complicates biasing/stability.", c: ["Reduced bandwidth only", "Increased noise and potential complexity issues", "Lower voltage gain", "Increased input impedance only"] },
            { q: "Why do MOSFETs have higher input impedance compared to BJTs?", a: "Because MOSFETs operate with essentially no input current", e: "The insulated gate of a MOSFET prevents current flow, leading to near-infinite input resistance.", c: ["Because MOSFETs operate at higher voltages", "Because MOSFETs have larger junction areas", "Because MOSFETs operate with essentially no input current", "Because MOSFETs have lower output resistance"] },
            { q: "What factors determine the frequency response of an operational amplifier?", a: "The open-loop gain and the bandwidth", e: "The Gain-Bandwidth Product (GBP) defines how the gain drops as frequency increases.", c: ["Input offset voltage and slew rate", "The open-loop gain and the bandwidth", "The supply voltage only", "Output current capability"] },
            { q: "What is the typical input impedance of an ideal operational amplifier?", a: "Very high (approaching infinity)", e: "Ideal op-amps draw zero current from the source.", c: ["Very low", "Moderate", "Very high (approaching infinity)", "Equal to output impedance"] },
            { q: "Which type of oscillator relies on a positive feedback loop to maintain continuous oscillations?", a: "Hartley oscillator", e: "Most oscillators use positive feedback; the Hartley specifically uses a tapped inductor.", c: ["Wien bridge oscillator", "Hartley oscillator", "RC phase-shift oscillator", "Crystal oscillator"] },
            { q: "What primarily causes the high-frequency response limitation of a BJT amplifier?", a: "The collector-emitter capacitance", e: "Internal parasitic capacitances create low-pass filters at high frequencies.", c: ["Base resistance", "The collector-emitter capacitance", "Load resistance", "Supply ripple"] },
            { q: "What is used to improve bandwidth and reduce distortion in an amplifier circuit?", a: "Feedback", e: "Negative feedback sacrifices gain for improved linearity and bandwidth.", c: ["Positive feedback", "Feedback", "Higher supply voltage", "Larger coupling capacitors"] },
            { q: "What device is used to step up DC voltage without using a transformer?", a: "Voltage multiplier circuit", e: "Voltage multipliers use diodes and capacitors to boost DC voltage peaks.", c: ["Zener regulator", "Voltage multiplier circuit", "Switching transformer", "Linear regulator"] },
            { q: "Which of the following primarily determines the cutoff frequency of a common-emitter BJT amplifier?", a: "III and IV", e: "Intrinsic capacitances (III) and external capacitors (IV) define the high and low frequency limits respectively.", c: ["I and II", "II and III", "III and IV", "I, III, and IV"] },
            { q: "In an inverting configuration of an op-amp, the output voltage is ______ the input voltage.", a: "Inversely proportional to", e: "Vout = -(Rf/Rin) * Vin. The negative sign implies an inversion.", c: ["Directly proportional to", "Equal to", "Inversely proportional to", "Independent of"] },
            { q: "What component in a BJT amplifier circuit provides negative feedback and helps stabilize the gain?", a: "Emitter resistor", e: "The emitter resistor Re provides local series-series negative feedback.", c: ["Collector resistor", "Base capacitor", "Emitter resistor", "Coupling capacitor"] },
            { q: "In an active low-pass filter, the cutoff frequency is achieved when the output voltage is ___ of the input voltage.", a: "70.7%", e: "The cutoff point is the -3dB point, where voltage is 1/√2 ≈ 70.7%.", c: ["50%", "63.2%", "70.7%", "90%"] },
            { q: "Which of the following are used to determine the input impedance of a common-source MOSFET amplifier?", a: "Gate-to-source capacitance and input resistance", e: "Input impedance is determined by the biasing network and internal gate capacitance.", c: ["Drain resistance and supply voltage", "Gate-to-source capacitance and input resistance", "Load resistance only", "Channel length and temperature"] },
            { q: "What happens to the bandwidth of an operational amplifier when negative feedback is applied?", a: "Bandwidth increases", e: "Gain-Bandwidth product is constant; lowering gain via feedback increases bandwidth.", c: ["Decreases significantly", "Remains constant", "Bandwidth increases", "Becomes unpredictable"] },
            { q: "What is the primary function of an inverter?", a: "Convert DC to AC", e: "Inverters turn DC power into AC power.", c: ["Convert AC to DC", "Convert DC to AC", "Amplify AC signals", "Regulate voltage"] },
            { q: "In a BJT, the majority charge carriers in an NPN transistor are:", a: "Electrons in the emitter and holes in the base", e: "N-type (Emitter/Collector) uses electrons; P-type (Base) uses holes.", c: ["Holes in emitter and collector", "Electrons in the emitter and holes in the base", "Electrons in emitter and collector", "Holes in base and collector"] },
            { q: "When a BJT operates in the active region, the base-emitter junction is ______-biased while the collector-base junction is ______-biased.", a: "Forward, reverse", e: "Standard configuration for amplification.", c: ["Reverse, reverse", "Forward, forward", "Forward, reverse", "Reverse, forward"] },
            { q: "What is the main reason why a PIN photodiode is used for high-speed optical communications?", a: "It reduces transit time", e: "The wide intrinsic region reduces capacitance and speeds up carrier transit.", c: ["Higher breakdown voltage", "Lower dark current", "It reduces transit time", "Higher gain"] },
            { q: "What effect do coupling and bypass capacitors have on the cutoff frequency of a common-emitter BJT amplifier?", a: "They decrease the cutoff frequency by allowing more low frequencies to pass", e: "Higher values shift the low-frequency cutoff downward.", c: ["Increase cutoff frequency", "Eliminate high-frequency response", "They decrease the cutoff frequency by allowing more low frequencies to pass", "Have no effect"] },
            { q: "What is a primary advantage of a cascaded amplifier configuration?", a: "Increased overall gain", e: "Total gain is the product of the individual stage gains.", c: ["Reduced noise", "Increased overall gain", "Lower bandwidth", "Simpler design"] },
            { q: "What determines the dominant pole frequency in a BJT amplifier’s frequency response?", a: "The internal capacitance", e: "Junction capacitances (Miller effect) usually dominate the high-frequency pole.", c: ["External load resistance", "Supply voltage", "The internal capacitance", "Base bias resistor"] },
            { q: "Which characteristic of MOSFETs contributes most to their high input impedance?", a: "The absence of a gate current due to the insulating oxide layer", e: "The SiO2 layer acts as a capacitor, blocking DC current.", c: ["High carrier mobility", "The absence of a gate current due to the insulating oxide layer", "Low drain resistance", "Small channel length"] },
            { q: "What is the main function of the active region in a BJT?", a: "To allow the transistor to amplify signals", e: "The linear region between saturation and cutoff used for high-fidelity gain.", c: ["Switching", "To allow the transistor to amplify signals", "Voltage regulation", "Power dissipation"] },
            { q: "What is defined as the ratio of the differential gain to the common-mode gain of an amplifier?", a: "Common Mode Rejection Ratio (CMRR)", e: "CMRR indicates how well the op-amp rejects noise present on both inputs.", c: ["Slew rate", "Gain-bandwidth product", "Common Mode Rejection Ratio (CMRR)", "Input offset voltage"] },
            { q: "Operational amplifiers are usually used with negative feedback to:", a: "Improve stability and reduce distortion", e: "Feedback linearizes the output and makes the circuit independent of the op-amp's internal gain variations.", c: ["Increase distortion", "Increase power consumption", "Improve stability and reduce distortion", "Reduce bandwidth drastically"] }
        ];

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let canAnswer = true;
        let userResponses = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initQuiz(shouldShuffle = true) {
            currentIndex = 0;
            score = 0;
            canAnswer = true;
            userResponses = [];
            questions = JSON.parse(JSON.stringify(rawData));
            if (shouldShuffle) shuffle(questions);
            questions.forEach(q => {
                q.choices = shuffle([...q.c]);
            });
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('review-section').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const prevResponse = userResponses[currentIndex];
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('score-text').innerText = `Score: ${score}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / questions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            if (prevResponse) {
                canAnswer = false;
                document.getElementById('feedback').classList.remove('hidden');
                document.getElementById('explanation-text').innerText = q.e;
                q.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-4 rounded-2xl border border-violet-100 bg-white text-slate-700 font-medium";
                    btn.innerText = choice;
                    btn.disabled = true;
                    if (choice.trim() === q.a.trim()) btn.classList.add('correct');
                    else if (choice === prevResponse.selected && !prevResponse.isCorrect) btn.classList.add('incorrect');
                    container.appendChild(btn);
                });
            } else {
                canAnswer = true;
                document.getElementById('feedback').classList.add('hidden');
                q.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-4 rounded-2xl border border-violet-100 bg-white text-slate-700 font-medium";
                    btn.innerText = choice;
                    btn.onclick = () => handleAnswer(choice, btn);
                    container.appendChild(btn);
                });
            }
        }

        function handleAnswer(choice, btn) {
            if (!canAnswer) return;
            canAnswer = false;
            const q = questions[currentIndex];
            const isCorrect = (choice.trim() === q.a.trim());
            
            userResponses[currentIndex] = {
                selected: choice,
                isCorrect: isCorrect,
                question: q.q,
                correctAnswer: q.a,
                explanation: q.e
            };
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.innerText.trim() === q.a.trim()) b.classList.add('correct');
                else if (b === btn && !isCorrect) b.classList.add('incorrect');
            });
            
            if (isCorrect) score++;
            
            document.getElementById('explanation-text').innerText = q.e;
            document.getElementById('feedback').classList.remove('hidden');
            document.getElementById('score-text').innerText = `Score: ${score}`;
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        document.getElementById('next-btn').onclick = () => {
            currentIndex++;
            if (currentIndex < questions.length) renderQuestion();
            else showResults();
        };

        function showResults() {
            document.getElementById('app').classList.add('hidden');
            const results = document.getElementById('results-screen');
            results.classList.remove('hidden');
            results.classList.add('flex');
            const percent = Math.round((score / questions.length) * 100);
            document.getElementById('final-percentage').innerText = `${percent}%`;
            document.getElementById('final-score').innerText = `You correctly answered ${score} out of ${questions.length} questions.`;
            const mistakes = userResponses.filter(r => r && !r.isCorrect);
            const reviewBtn = document.getElementById('review-mistakes-btn');
            if (mistakes.length > 0) {
                reviewBtn.classList.remove('hidden');
                populateReview(mistakes);
            } else reviewBtn.classList.add('hidden');
        }

        function populateReview(mistakes) {
            const container = document.getElementById('mistakes-container');
            container.innerHTML = '';
            mistakes.forEach((m) => {
                const div = document.createElement('div');
                div.className = "pb-6 border-b border-violet-50 last:border-0";
                div.innerHTML = `
                    <p class="font-medium text-slate-800 mb-2">${m.question}</p>
                    <div class="text-sm mb-2">
                        <span class="text-red-500 line-through mr-2">You chose: ${m.selected}</span><br>
                        <span class="text-green-600 font-bold">Correct: ${m.correctAnswer}</span>
                    </div>
                    <p class="text-xs text-slate-500 italic bg-violet-50 p-3 rounded-lg">${m.explanation}</p>
                `;
                container.appendChild(div);
            });
        }

        function toggleReview() {
            const section = document.getElementById('review-section');
            section.classList.toggle('hidden');
            if (!section.classList.contains('hidden')) section.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz(shouldShuffle) {
            initQuiz(shouldShuffle);
        }

        initQuiz(true);
    </script>
