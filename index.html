<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electronics Reviewer - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f0ff 0%, #e0e0ff 100%);
            min-height: 100vh;
            color: #4a4a8a;
        }
        .floating-book { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .glass-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(100,100,180,0.1);
        }
        .option-btn {
            transition: 0.2s ease;
            border: 2px solid transparent;
            width: 100%;
            text-align: left;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f5f3ff;
            border-color: #a78bfa;
        }
        .correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
        .incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .progress-bar { transition: width 0.4s ease; }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-4">

<!-- LANDING SCREEN -->
<div id="landing-screen" class="w-full max-w-2xl text-center space-y-8 py-12">
    <div class="flex justify-center mb-6">
        <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg floating-book">
            📘
        </div>
    </div>
    <h1 class="text-4xl font-bold text-[#5b21b6]">Go, Future Engineer! ✨</h1>
    <button onclick="startQuiz(false)"
        class="glass-card w-full py-6 px-8 hover:bg-purple-50 transition">
        Start Quiz (1–100)
    </button>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz-screen" class="hidden w-full max-w-2xl space-y-4">
    <div class="flex justify-between">
        <button onclick="goBack()">Exit</button>
        <div id="score-display">Score: 0/100</div>
    </div>

    <div class="w-full bg-purple-100 rounded-full h-2">
        <div id="progress" class="progress-bar bg-purple-500 h-2 rounded-full" style="width:0%"></div>
    </div>

    <div class="glass-card p-6 space-y-6">
        <div id="question-text" class="text-xl font-semibold"></div>
        <div id="options-container" class="space-y-3"></div>

        <div id="explanation-container" class="hidden">
            <div id="feedback-label" class="font-bold"></div>
            <p id="explanation-text"></p>
            <button onclick="nextQuestion()" class="mt-3 bg-purple-600 text-white px-4 py-2 rounded">
                Continue
            </button>
        </div>
    </div>
</div>

<!-- RESULTS -->
<div id="results-screen" class="hidden text-center space-y-4">
    <h2 class="text-2xl font-bold">Quiz Completed!</h2>
    <div id="final-score" class="text-3xl font-bold"></div>
    <button onclick="resetQuiz()" class="bg-purple-600 text-white px-6 py-2 rounded">
        Restart
    </button>
</div>

/* ================= QUIZ ENGINE ================= */

let questions = [];
let currentIndex = 0;
let score = 0;
let userResponses = {};

function startQuiz() {
    questions = JSON.parse(JSON.stringify(rawQuestions));
    currentIndex = 0;
    score = 0;
    userResponses = {};
    document.getElementById('landing-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    const total = questions.length;

    document.getElementById('progress').style.width =
        ((currentIndex / total) * 100) + "%";

    document.getElementById('score-display').innerText =
        "Score: " + score + "/" + total;

    document.getElementById('question-text').innerText = q.q;

    const container = document.getElementById('options-container');
    container.innerHTML = "";

    q.c.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "option-btn glass-card p-3";
        btn.innerText = choice;
        btn.onclick = () => handleAnswer(choice);
        container.appendChild(btn);
    });

    document.getElementById('explanation-container').classList.add('hidden');
}

function handleAnswer(choice) {
    const q = questions[currentIndex];
    const isCorrect = choice === q.a;
    if (isCorrect) score++;

    document.getElementById('feedback-label').innerText =
        isCorrect ? "Correct! ✨" : "Incorrect";

    document.getElementById('explanation-text').innerText = q.e;
    document.getElementById('explanation-container').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText =
        score + "/" + questions.length;
}

function resetQuiz() {
    document.getElementById('results-screen').classList.add('hidden');
    document.getElementById('landing-screen').classList.remove('hidden');
}

function goBack() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('landing-screen').classList.remove('hidden');
}

</script>
</body>
</html>
