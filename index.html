<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Comprehensive Reviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f0ff 0%, #e0e0ff 100%);
            min-height: 100vh;
            color: #4a4a8a;
        }
        .floating-book { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 2rem; box-shadow: 0 10px 30px rgba(100, 100, 180, 0.1); }
        .option-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; width: 100%; text-align: left; }
        .option-btn:hover:not(:disabled) { background-color: #f5f3ff; border-color: #a78bfa; transform: scale(1.01); }
        .correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { transition: width 0.4s ease-in-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

                    <div class="text-sm text-purple-500">Shuffled Question Pool</div>

                <span class="bg-indigo-100 text-indigo-600 px-4 py-1 rounded-full text-sm font-bold group-hover:bg-indigo-200">Shuffle</span>
            </button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden w-full max-w-2xl space-y-4 fade-in">
        <div class="flex items-center justify-between px-2">
            <div class="flex items-center gap-2 md:gap-4 overflow-x-auto">
                <button onclick="goBack()" class="text-purple-600 font-medium flex items-center gap-1 hover:text-purple-800 whitespace-nowrap">Exit</button>
                <div class="h-4 w-px bg-purple-200"></div>
                <button id="prev-btn" onclick="previousQuestion()" class="text-purple-500 text-xs md:text-sm font-medium hover:text-purple-700 disabled:opacity-30 disabled:cursor-not-allowed whitespace-nowrap">Previous</button>
            </div>
            <div class="text-purple-900 font-bold bg-white px-3 py-1 rounded-full shadow-sm border border-purple-50 text-xs md:text-base whitespace-nowrap" id="score-display">Score: 0/122</div>
        </div>
        <div class="w-full bg-purple-100 rounded-full h-2">
            <div id="progress" class="progress-bar bg-purple-500 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <div class="glass-card p-6 md:p-8 space-y-8">
            <div id="question-text" class="text-xl md:text-2xl font-semibold text-gray-800 leading-tight min-h-[80px]"></div>
            <div id="options-container" class="grid grid-cols-1 gap-4"></div>
            <div id="explanation-container" class="hidden p-6 bg-purple-50 rounded-2xl border border-purple-100 space-y-2">

    </div>

    <div id="results-screen" class="hidden w-full max-w-2xl text-center space-y-8 py-12 fade-in">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6">
                <button onclick="resetQuiz()" class="bg-purple-600 text-white py-4 rounded-2xl font-bold hover:bg-purple-700">Try Again</button>
                <button onclick="showReview()" id="review-btn" class="bg-white border-2 border-purple-200 text-purple-600 py-4 rounded-2xl font-bold hover:bg-purple-50">Review Mistakes</button>
            </div>
        </div>
    </div>

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let userResponses = {};

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startQuiz(shuffle) {
            questions = JSON.parse(JSON.stringify(originalPool));
            if (shuffle) shuffleArray(questions);
            currentIndex = 0; score = 0; userResponses = {};
            document.getElementById('landing-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function resetQuiz() {
            currentIndex = 0; score = 0; userResponses = {};
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function previousQuestion() { if (currentIndex > 0) { currentIndex--; showQuestion(); } }

        function showQuestion() {
            const q = questions[currentIndex];
            const total = questions.length;
            document.getElementById('progress').style.width = `${((currentIndex) / total) * 100}%`;
            document.getElementById('score-display').innerText = `Score: ${score}/${total}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.q}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            if (!q.shuffledChoices) {
                q.shuffledChoices = [...q.c];
                shuffleArray(q.shuffledChoices);
            }

            const existingResponse = userResponses[q.id];
            q.shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn glass-card p-5 text-left text-lg font-medium';
                btn.innerText = choice;
                if (existingResponse) {
                    btn.disabled = true;
                    if (choice === q.a) btn.classList.add('correct');
                    if (choice === existingResponse.choice && choice !== q.a) btn.classList.add('incorrect');
                } else {
                    btn.onclick = () => handleAnswer(choice, btn);
                }
                container.appendChild(btn);
            });

            if (existingResponse) showExplanation(existingResponse.isCorrect);
            else document.getElementById('explanation-container').classList.add('hidden');
        }

        function handleAnswer(choice, btn) {
            const q = questions[currentIndex];
            const isCorrect = (choice === q.a);
            userResponses[q.id] = { choice, isCorrect };
            if (isCorrect) score++;
            showQuestion();
        }

        function showExplanation(isCorrect) {
            const q = questions[currentIndex];
            const fb = document.getElementById('feedback-label');
            fb.innerText = isCorrect ? "Excellent! ✨" : "Not quite.";
            fb.className = isCorrect ? "font-bold text-lg text-green-600" : "font-bold text-lg text-red-600";
            document.getElementById('explanation-text').innerText = q.e;
            document.getElementById('explanation-container').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) showQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score}/${questions.length}`;
            const pct = (score / questions.length) * 100;
            document.getElementById('result-message').innerText = pct >= 85 ? "You're ready for the board exam!" : "Great practice session. Review your mistakes below.";
        }

        function showReview() {
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('review-screen').classList.remove('hidden');
            const list = document.getElementById('mistakes-list');
            list.innerHTML = '';
            questions.forEach(q => {
                const res = userResponses[q.id];
                if (res && !res.isCorrect) {
                    const card = document.createElement('div');
                    card.className = 'glass-card p-6 text-left border-l-8 border-red-400';
                    card.innerHTML = `<div class="font-bold text-lg mb-2">${q.q}</div>
                        <div class="space-y-1">
                            <div class="text-red-500 font-medium">Your answer: ${res.choice}</div>
                            <div class="text-green-600 font-bold">Correct answer: ${q.a}</div>
                            <div class="mt-4 p-3 bg-purple-50 rounded-lg text-sm text-gray-600">Note: ${q.e}</div>
                        </div>`;
                    list.appendChild(card);
                }
            });
            if (list.innerHTML === '') list.innerHTML = '<div class="glass-card p-8 text-center text-xl font-bold text-green-600">Perfect Score! No mistakes to review. 🌟</div>';
        }

        function goBack() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('landing-screen').classList.remove('hidden');
        }
    </script>
