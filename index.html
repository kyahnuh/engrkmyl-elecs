<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Comprehensive Reviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f0ff 0%, #e0e0ff 100%);
            min-height: 100vh;
            color: #4a4a8a;
        }
        .floating-book { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 2rem; box-shadow: 0 10px 30px rgba(100, 100, 180, 0.1); }
        .option-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; width: 100%; text-align: left; cursor: pointer; }
        .option-btn:hover:not(:disabled) { background-color: #f5f3ff; border-color: #a78bfa; transform: scale(1.01); }
        .correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { transition: width 0.4s ease-in-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div id="landing-screen" class="w-full max-w-2xl text-center space-y-8 py-12">
        <div class="flex justify-center mb-6">
            <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg floating-book">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
            </div>
        </div>
        <h1 class="text-4xl md:text-5xl font-bold text-[#5b21b6]">Master Electronics ✨</h1>
        <p class="text-purple-600 font-medium">122 Questions with Randomized Choices</p>
        <div class="space-y-4 pt-4">
            <button onclick="startQuiz(false)" class="glass-card w-full py-6 px-8 flex justify-between items-center hover:bg-purple-50 transition-colors group">
                <div class="text-left">
                    <div class="text-xl font-bold text-purple-900">Standard Review</div>
                    <div class="text-sm text-purple-500">Fixed Order</div>
                </div>
                <span class="bg-purple-100 text-purple-600 px-4 py-1 rounded-full text-sm font-bold group-hover:bg-purple-200">Start</span>
            </button>
            <button onclick="startQuiz(true)" class="glass-card w-full py-6 px-8 flex justify-between items-center hover:bg-purple-50 transition-colors group">
                <div class="text-left">
                    <div class="text-xl font-bold text-purple-900">Randomized Challenge</div>
                    <div class="text-sm text-purple-500">Shuffle Questions & Choices</div>
                </div>
                <span class="bg-indigo-100 text-indigo-600 px-4 py-1 rounded-full text-sm font-bold group-hover:bg-indigo-200">Shuffle All</span>
            </button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden w-full max-w-2xl space-y-4 fade-in">
        <div class="flex items-center justify-between px-2">
            <div class="flex items-center gap-2 md:gap-4 overflow-x-auto">
                <button onclick="goBack()" class="text-purple-600 font-medium flex items-center gap-1 hover:text-purple-800 whitespace-nowrap">Exit</button>
                <div class="h-4 w-px bg-purple-200"></div>
                <button id="prev-btn" onclick="previousQuestion()" class="text-purple-500 text-xs md:text-sm font-medium hover:text-purple-700 disabled:opacity-30 disabled:cursor-not-allowed whitespace-nowrap">Prev</button>
                <button onclick="shuffleCurrentSet()" class="text-indigo-600 text-xs md:text-sm font-medium hover:text-indigo-800 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Shuffle
                </button>
            </div>
            <div class="text-purple-900 font-bold bg-white px-3 py-1 rounded-full shadow-sm border border-purple-50 text-xs md:text-base whitespace-nowrap" id="score-display">Score: 0/122</div>
        </div>
        <div class="w-full bg-purple-100 rounded-full h-2">
            <div id="progress" class="progress-bar bg-purple-500 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <div class="glass-card p-6 md:p-8 space-y-8">
            <div id="question-text" class="text-xl md:text-2xl font-semibold text-gray-800 leading-tight min-h-[80px]"></div>
            <div id="options-container" class="grid grid-cols-1 gap-4"></div>
            <div id="explanation-container" class="hidden p-6 bg-purple-50 rounded-2xl border border-purple-100 space-y-2">
                <div id="feedback-label" class="font-bold text-lg"></div>
                <p id="explanation-text" class="text-gray-700 italic"></p>
