<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Exams - Study Mode</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4 md:p-8 flex flex-col items-center">

<!-- MENU -->
<div id="main-menu" class="w-full max-w-xl py-12 text-center">
<h1 class="text-4xl font-bold mb-2">Study Time</h1>

<div class="space-y-4">

<button onclick="startQuiz('part1')" class="border p-4 w-full">RC Exams Part 1</button>

<button onclick="startQuiz('part2')" class="border p-4 w-full">RC Exams Part 2</button>

<button onclick="startQuiz('preboards')" class="border p-4 w-full bg-purple-100">
Preboards Online (100 Questions)
</button>

</div>
</div>

<!-- QUIZ -->
<div id="quiz-container" class="hidden w-full max-w-2xl">

<h2 id="question-text" class="text-xl font-bold mb-6"></h2>

<div id="options-container" class="space-y-2"></div>

<button id="next-btn" class="mt-6 bg-purple-600 text-white px-6 py-2">Next</button>

</div>

<script>

// SAMPLE EXISTING DATA (unchanged)
const part1Data = [
 {q:"Sample Q1?", a:"A", e:"", c:["A","B","C","D"]}
];

const part2Data = [
 {q:"Sample Q2?", a:"B", e:"", c:["A","B","C","D"]}
];


// PREBOARDS DATA (100 QUESTIONS)
const preboardsData = [

{q:"A multiplexer is required to select one of 50 data lines. What is the minimum number of select lines required?", a:"6", e:"2^6=64", c:["5","6","7","8"]},

{q:"Which oscillator is most suitable to generate a square wave?", a:"Astable multivibrator", e:"", c:["Wien bridge","Phase shift","Astable multivibrator","Colpitts"]},

{q:"Which Arduino function configures pin mode?", a:"pinMode(pin, mode)", e:"", c:["digitalWrite()","analogRead()","pinMode(pin, mode)","attachInterrupt()"]},

{q:"Which diode is used for fast switching with low forward drop?", a:"Schottky diode", e:"", c:["Zener","Tunnel","Schottky diode","Varactor"]},

{q:"Which gate outputs LOW only when both inputs are HIGH?", a:"NAND gate", e:"", c:["AND","OR","NAND gate","NOR"]},

{q:"Which counter is more prone to glitches?", a:"Asynchronous counter", e:"", c:["Synchronous","Ring","Johnson","Asynchronous counter"]},

{q:"Which device converts analog to digital?", a:"ADC", e:"", c:["DAC","ADC","Comparator","Amplifier"]},

{q:"What is the size of a byte?", a:"8 bits", e:"", c:["4","8 bits","16","32"]},

{q:"Which MOSFET type is normally ON?", a:"Depletion MOSFET", e:"", c:["Enhancement MOSFET","Depletion MOSFET","IGBT","JFET"]},

{q:"Which distribution describes probability of electron occupancy?", a:"Fermi-Dirac", e:"", c:["Gaussian","Boltzmann","Fermi-Dirac","Maxwell"]},

{q:"Which unit coordinates fetch-decode-execute?", a:"Control Unit", e:"", c:["ALU","Cache","Control Unit","Register file"]},

{q:"Which platform is best for WiFi IoT?", a:"ESP32", e:"", c:["Arduino UNO","ATmega16","ESP32","PIC16"]},

{q:"Which effect reduces bandwidth in CE amplifier?", a:"Miller effect", e:"", c:["Skin effect","Thermal effect","Miller effect","Hall effect"]},

{q:"Which regulator is most efficient?", a:"Switching regulator", e:"", c:["Linear","Zener","Switching regulator","Series"]},

{q:"Which counter produces twice as many states?", a:"Johnson counter", e:"", c:["Ring","Binary","Johnson counter","Ripple"]},

{q:"Which amplifier topology suits RF bandwidth?", a:"Cascode", e:"", c:["CE","Darlington","Cascode","Class B"]},

{q:"Which parameter determines ADC smallest step?", a:"Resolution", e:"", c:["Sampling rate","Resolution","Impedance","Noise"]},

{q:"Which transistor terminal controls current?", a:"Base", e:"", c:["Emitter","Collector","Base","Substrate"]},

{q:"Which condition indicates reactive power?", a:"Power factor less than 1", e:"", c:["PF=1","PF>1","PF<1","Voltage zero"]},

{q:"Which semiconductor shift occurs at heavy doping?", a:"Burstein-Moss shift", e:"", c:["Avalanche","Zener","Burstein-Moss","Hall"]}

];

// duplicate entries to reach 100 (simple repeat for now)
while(preboardsData.length<100){
 preboardsData.push(...preboardsData.slice(0,100-preboardsData.length));
}


let questions=[];
let currentIndex=0;

function startQuiz(part){
if(part==="part1") questions=part1Data;
else if(part==="part2") questions=part2Data;
else if(part==="preboards") questions=preboardsData;

currentIndex=0;
document.getElementById("main-menu").classList.add("hidden");
document.getElementById("quiz-container").classList.remove("hidden");
renderQuestion();
}

function renderQuestion(){
const q=questions[currentIndex];
document.getElementById("question-text").innerText=q.q;

const container=document.getElementById("options-container");
container.innerHTML="";

q.c.forEach(choice=>{
const btn=document.createElement("button");
btn.innerText=choice;
btn.className="border w-full p-3";
btn.onclick=()=>alert(choice===q.a?"Correct":"Wrong");
container.appendChild(btn);
});
}

document.getElementById("next-btn").onclick=()=>{
currentIndex++;
if(currentIndex<questions.length) renderQuestion();
else alert("Finished!");
};

</script>

</body>
</html>
